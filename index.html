<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Especial ❤️</title>

<style>
body {
    background: #ffe6f0;
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
}

h1, h2 {
    color: #ff0066;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    margin: 10px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#sim {
    background: #4CAF50;
    color: white;
}

#nao {
    background: red;
    color: white;
    position: absolute;
    left: 55%;
    top: 120px;
}

.opcao {
    background: #ff66a3;
    color: white;
}

input {
    padding: 10px;
    font-size: 18px;
    border-radius: 10px;
}

img {
    border-radius: 15px;
    margin: 10px;
}
</style>

</head>

<body>

<div id="tela">
    <h1>Você aceita sair comigo Layla? ❤️</h1>

    <img src="davi1.png" width="180">
    <img src="davi2.png" width="180">

    <br>

    <img src="gatinho.png" width="180">
    <img src="cachorrinho.png" width="180">

    <br><br>

    <button id="sim" onclick="dataEncontro()">
        Sim 😍
    </button>

    <button id="nao">
        Não 😢
    </button>
</div>

<script>

// Faz o botão "Não" fugir
let nao = document.getElementById("nao");

nao.addEventListener("mouseover", function() {
    let x = Math.random() * (window.innerWidth - 120);
    let y = Math.random() * (window.innerHeight - 80);

    nao.style.left = x + "px";
    nao.style.top = y + "px";
});

// Escolher data
function dataEncontro() {
    document.getElementById("tela").innerHTML = `
        <h1>❤️ Ebaaaa! Você aceitou 😍</h1>

        <img src="davi2.png" width="220">

        <p>
        Eu depois que você apertou "Sim" 😂❤️
        </p>

        <h2>Que dia ficaria melhor pra você? 📅</h2>

        <input type="date" id="dia">

        <br><br>

        <button onclick="horaEncontro()">
            Próximo ➡️
        </button>
    `;
}

// Escolher hora
function horaEncontro() {
    let dia = document.getElementById("dia").value;

    document.getElementById("tela").innerHTML = `
        <h1>Agora só falta a hora ⏰</h1>

        <p>
        Prometo chegar no horário 😎
        </p>

        <input type="time" id="hora">

        <br><br>

        <button onclick="escolherLugar('${dia}')">
            Próximo ➡️
        </button>
    `;
}

// Escolher local
function escolherLugar(dia) {
    let hora = document.getElementById("hora").value;

    document.getElementById("tela").innerHTML = `
        <h1>Onde vamos nos encontrar? 📍</h1>

        <img src="gatinho.png" width="220">

        <p>
        Escolhe com carinho 🥺❤️
        </p>

        <button class="opcao"
            onclick="finalizar('${dia}','${hora}','Shopping')">
            🛍️ Shopping
        </button>

        <button class="opcao"
            onclick="finalizar('${dia}','${hora}','Centro')">
            🏙️ Centro
        </button>

        <button class="opcao"
            onclick="finalizar('${dia}','${hora}','Parque')">
            🌳 Parque
        </button>
    `;
}

// Tela final
function finalizar(dia, hora, lugar) {
    document.getElementById("tela").innerHTML = `
        <h1>💖 Encontro Marcado 💖</h1>

        <h2>
            📅 Dia: ${dia}<br><br>
            ⏰ Hora: ${hora}<br><br>
            📍 Local: ${lugar}
        </h2>

        <img src="cachorrinho.png" width="220">
        <img src="gatinho.png" width="220">

        <br>

        <img src="davi1.png" width="220">

        <p>
        🥳 Eu depois de conseguir marcar esse encontro
        </p>

        <p>
        Mal posso esperar para te ver ❤️
        </p>

        <p>
        Obrigado por aceitar 😊
        </p>
    `;
}

</script>

</body>
</html>
